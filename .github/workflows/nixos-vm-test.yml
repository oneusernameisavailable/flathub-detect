name: NixOS VM Test
on: [push, pull_request, schedule]

jobs:
  nixos-vm-test:
    name: NixOS VM - Custom Installation Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate SSH key
        run: |
          ssh-keygen -t ed25519 -f ./ssh_key -N ""
          echo "PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat ./ssh_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "PUBLIC_KEY=$(cat ./ssh_key.pub)" >> $GITHUB_ENV

      - name: Build NixOS VM
        run: |
          # Update nixos-test-vm.nix with the generated public key
          sed -i "s|REPLACE_SSH_KEY|$PUBLIC_KEY|" nixos-test-vm.nix
          # Inject fx-flathub-detect.sh content into VM using Python (avoids sed issues)
          python3 << 'PYEOF'
import sys
with open('fx-flathub-detect.sh', 'r') as f:
    content = f.read()
# Escape for Nix string: escape backslashes, quotes, and newlines
content = content.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n')
with open('nixos-test-vm.nix', 'r') as f:
    nix_content = f.read()
nix_content = nix_content.replace('SCRIPT_CONTENT_PLACEHOLDER', content)
with open('nixos-test-vm.nix', 'w') as f:
    f.write(nix_content)
PYEOF
          nix build .#nixosConfigurations.flathub-test-vm.config.system.build.vm -L --out-link ./nixos-vm
          ls -la ./nixos-vm/
          ls -la ./nixos-vm/bin/
          find ./nixos-vm -name "run-*" -type f

      - name: Run NixOS VM and Test
        run: |
          # Start VM in background (qemu-vm creates bin/run-<hostname> in VM derivation output)
          ./nixos-vm/bin/run-flathub-test-vm &
          VM_PID=$!
          
          # Wait for VM to boot
          echo "Waiting for VM to boot..."
          sleep 30
          
          # Test SSH connectivity using SSH key
          for i in {1..10}; do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o IdentitiesOnly=yes -i ./ssh_key root@localhost -p 2222 "echo 'SSH ready'" 2>/dev/null; then
              echo "SSH ready!"
              break
            fi
            echo "Waiting for SSH... ($i/10)"
            sleep 10
          done
          
          # Run validation script in VM
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 -o IdentitiesOnly=yes -i ./ssh_key root@localhost "
            source /src/fx-flathub-detect.sh
            flathub_detect
            echo 'STATE:' \$FLATHUB_STATE
            echo 'SCOPE:' \$FLATHUB_SCOPE
            echo 'ENABLED:' \$FLATHUB_ENABLED
            [[ "\$FLATHUB_STATE" == "enabled" ]] && [[ "\$FLATHUB_SCOPE" == *extra* ]] && echo 'PASS' || (echo 'FAIL' && exit 1)
          "
          
          # Cleanup
          kill $VM_PID 2>/dev/null || true
        timeout-minutes: 15