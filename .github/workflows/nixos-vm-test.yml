name: NixOS VM Test
on: [push, pull_request, schedule]

jobs:
  nixos-vm-test:
    name: NixOS VM - Custom Installation Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build NixOS VM
        run: |
          nix build .#nixosConfigurations.flathub-test-vm.config.system.build.vm -L --out-link ./nixos-vm
          ls -la ./nixos-vm/
          find ./nixos-vm -name "run-*" -type f

      - name: Run NixOS VM and Test
        run: |
          # Start VM in background (qemu-vm creates run-vm.sh in output root)
          ./nixos-vm/run-vm.sh &
          VM_PID=$!
          
          # Wait for VM to boot
          echo "Waiting for VM to boot..."
          sleep 30
          
          # Test SSH connectivity
          for i in {1..10}; do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o StrictHostKeyChecking=no root@localhost -p 2222 "echo 'SSH ready'" 2>/dev/null; then
              echo "SSH ready!"
              break
            fi
            echo "Waiting for SSH... ($i/10)"
            sleep 10
          done
          
          # Run validation script in VM
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 root@localhost "
            source /src/fx-flathub-detect.sh
            flathub_detect
            echo 'STATE:' \$FLATHUB_STATE
            echo 'SCOPE:' \$FLATHUB_SCOPE
            echo 'ENABLED:' \$FLATHUB_ENABLED
            [[ "\$FLATHUB_STATE" == "enabled" ]] && [[ "\$FLATHUB_SCOPE" == *extra* ]] && echo 'PASS' || (echo 'FAIL' && exit 1)
          "
          
          # Cleanup
          kill $VM_PID 2>/dev/null || true
        timeout-minutes: 15