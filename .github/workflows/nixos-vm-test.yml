name: NixOS VM Test
on: [push, pull_request, schedule]

jobs:
  nixos-vm-test:
    name: NixOS VM - Flathub Detection Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate SSH key
        run: |
          ssh-keygen -t ed25519 -f ./ssh_key -N ""
          echo "PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat ./ssh_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "PUBLIC_KEY=$(cat ./ssh_key.pub)" >> $GITHUB_ENV

      - name: Build NixOS VM
        run: |
          # Update nixos-test-vm.nix with the generated public key
          sed -i "s|REPLACE_SSH_KEY|$PUBLIC_KEY|" nixos-test-vm.nix
          nix build .#nixosConfigurations.flathub-test-vm.config.system.build.vm -L --out-link ./nixos-vm
          ls -la ./nixos-vm/
          ls -la ./nixos-vm/bin/
          find ./nixos-vm -name "run-*" -type f

      - name: Run NixOS VM and Test
        run: |
          # Start VM in background (qemu-vm creates bin/run-<hostname> in VM derivation output)
          ./nixos-vm/bin/run-flathub-test-vm &
          VM_PID=$!
          
          # Wait for VM to boot
          echo "Waiting for VM to boot..."
          sleep 30
          
          # Test SSH connectivity using SSH key
          for i in {1..10}; do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o IdentitiesOnly=yes -i ./ssh_key root@localhost -p 2222 "echo 'SSH ready'" 2>/dev/null; then
              echo "SSH ready!"
              break
            fi
            echo "Waiting for SSH... ($i/10)"
            sleep 10
          done
          
          # Run validation script in VM - verify library loads and runs without errors
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 -o IdentitiesOnly=yes -i ./ssh_key root@localhost "
            bash -l -c '
              echo \"PATH: \$PATH\"
              which flatpak || echo \"flatpak not in PATH\"
              ls -la /run/current-system/sw/bin/flatpak 2>/dev/null || echo \"flatpak not in /run/current-system/sw/bin\"
              echo \"flatpak --version: \$(flatpak --version 2>&1)\"
              flatpak --version 2>&1 | head -1
              source /src/fx-flathub-detect.sh
              flathub_detect
              echo STATE: \$FLATHUB_STATE
              echo SCOPE: \$FLATHUB_SCOPE
              echo ENABLED: \$FLATHUB_ENABLED
              # Verify library runs without errors (state can be not-configured if Flathub not configured)
              [[ -n \"\$FLATHUB_STATE\" ]] && [[ -n \"\$FLATHUB_SCOPE\" ]] && [[ \"\$FLATHUB_ENABLED\" =~ ^[01]$ ]] && echo PASS || (echo FAIL && exit 1)
            '
          "
          
          # Cleanup
          kill $VM_PID 2>/dev/null || true
        timeout-minutes: 15