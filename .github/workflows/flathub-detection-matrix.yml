name: Flathub Detection Matrix
on: [push, pull_request, schedule]

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CRITICAL - Fedora family
          - { distro: fedora:41, flatpak: "1.18", scenario: enabled-system, selinux: enforcing, name: "Fedora 41 Workstation" }
          - { distro: fedora:40, flatpak: "1.18", scenario: enabled-system, selinux: enforcing, name: "Fedora 40 Workstation" }

          # CRITICAL - RHEL family
          - { distro: rockylinux/rockylinux:9, flatpak: "1.18", scenario: enabled-system, selinux: enforcing, name: "Rocky Linux 9" }
          - { distro: almalinux:9, flatpak: "1.18", scenario: enabled-system, selinux: enforcing, name: "AlmaLinux 9" }

          # CRITICAL - Debian/Ubuntu family
          - { distro: ubuntu:24.04, flatpak: "1.18", scenario: enabled-system, apparmor: true, name: "Ubuntu 24.04" }
          - { distro: ubuntu:22.04, flatpak: "1.18", scenario: enabled-system, apparmor: true, name: "Ubuntu 22.04" }
          - { distro: debian:12, flatpak: "1.18", scenario: enabled-system, name: "Debian 12" }
          # Debian 11 EOL - use debian:12 for version regression instead

          # CRITICAL - Arch family
          - { distro: archlinux/archlinux:latest, flatpak: "1.18", scenario: enabled-system, name: "Arch Linux" }

          # HIGH - Extended coverage
          - { distro: opensuse/tumbleweed:latest, flatpak: "1.18", scenario: enabled-system, name: "openSUSE Tumbleweed" }
          - { distro: opensuse/tumbleweed:latest, flatpak: "1.14", scenario: enabled-system, name: "openSUSE Tumbleweed (flatpak 1.14)" }
          - { distro: alpine:3.20, flatpak: "1.18", scenario: enabled-user, name: "Alpine 3.20" }
          - { distro: alpine:3.19, flatpak: "1.18", scenario: enabled-user, name: "Alpine 3.19" }

          # MEDIUM - Version regression (using supported distros)
          - { distro: ubuntu:22.04, flatpak: "1.15", scenario: enabled-system, apparmor: true, name: "Ubuntu 22.04 (flatpak 1.15)" }
          - { distro: fedora:40, flatpak: "1.15", scenario: enabled-system, selinux: enforcing, name: "Fedora 40 (flatpak 1.15)" }

    steps:
      - uses: actions/checkout@v4
      - name: Run validation
        run: |
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/src \
            ${{ matrix.distro }} \
            /src/test/ci/validate-detection.sh ${{ matrix.scenario }} ${{ matrix.selinux || '' }} ${{ matrix.apparmor || '' }}
        timeout-minutes: 15